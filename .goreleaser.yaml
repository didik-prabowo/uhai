# What a tag turns into. `git tag v0.1.0 && git push --tags` is the whole
# release process; the workflow in .github/workflows/release.yml runs this.
#
# Try it without tagging anything: `make release-snapshot`.
version: 2

project_name: uhai

before:
  hooks:
    # Not `go mod tidy`: a release must build what is committed, and a hook
    # that edits go.mod during the build can only make the artifact disagree
    # with the tag it is named after.
    - go mod download

builds:
  - id: uhai
    main: ./cmd/uhai
    binary: uhai
    env:
      # The same reason the Makefile says it: nothing here needs cgo, and
      # without it the binary is static and runs on a machine that has
      # nothing installed.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # No windows. It compiles — `make windows` vets it every CI run — and
    # nobody has ever run it. Shipping a binary is a claim that it works, and
    # docs/roadmap.md says plainly that this one is untested. Someone who
    # wants to try builds from source and tells us what broke; add
    # `windows` here the day one of them reports back.
    flags:
      - -trimpath
    ldflags:
      # -s -w drop the symbol table and DWARF: a third off the binary, and
      # nothing a user of a release would have used them for.
      #
      # .Tag rather than .Version because GoReleaser strips the leading v
      # from the latter, and the binary should answer with the same string
      # that was tagged. internal/build/build_test.go holds this path.
      - -s -w
      - -X github.com/didik-prabowo/uhai/internal/build.version={{ .Tag }}

archives:
  - id: uhai
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    # The commit messages here carry the reasoning and are long. The subject
    # line is what belongs in a changelog; the body is what `git log` is for.
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Co-Authored-By"

release:
  draft: false
  prerelease: auto
  footer: |
    Built without cgo, so the binary is static. macOS will quarantine a
    downloaded one — see the README for the one command that clears it.

# Homebrew, written out and switched off. Two things have to exist before it
# can be turned on, and neither can be done from here:
#
#   1. a public repository `didik-prabowo/homebrew-tap` — the `homebrew-`
#      prefix is dropped in use, which is why people type
#      `brew install didik-prabowo/tap/uhai`
#   2. a Personal Access Token with write access to it, saved on THIS
#      repository as the secret HOMEBREW_TAP_TOKEN, and passed to the release
#      job as an env var. The built-in GITHUB_TOKEN cannot do this: it may
#      only write to the repository it is running in.
#
# Then delete the `#` from the block below and tag. Do not enable it before
# the tap exists: GoReleaser pushes the formula *after* building the
# archives, so a missing tap turns a release that otherwise worked into a
# failed one.
#
# brews:
#   - name: uhai
#     repository:
#       owner: didik-prabowo
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     homepage: https://github.com/didik-prabowo/uhai
#     description: A coding agent that lives in the terminal
#     license: MIT
#     # Not `depends_on: go`: the binary is static and needs nothing.
#     test: |
#       assert_match version.to_s, shell_output("#{bin}/uhai -version")
#     caveats: |
#       uhai opens without a provider. Type /connect to add one; the key is
#       kept in ~/.uhai/auth.json, mode 0600.
