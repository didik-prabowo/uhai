name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # creating the release and uploading its archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the changelog is built from the commits
          # since the last tag and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # A tag that does not build is a tag that has to be deleted and pushed
      # again, and a deleted tag is the one thing git users cannot be asked to
      # forget. Cheaper to find out here.
      - name: the tests, before anything is published
        run: make check

      # GoReleaser pushes the Homebrew formula after the archives are built,
      # so a missing token is discovered at the end of a release that
      # otherwise worked — and a tag cannot be reused. Ten seconds here saves
      # deleting one.
      # A prerelease does not push to the tap (skip_upload: auto), so it does
      # not need the token — and refusing to release a beta over a secret it
      # will never use would be the check getting in the way of the thing it
      # protects.
      - name: the tap token is set, for a release that will use it
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            # Present is not the same as usable. A fine-grained PAT expires,
            # and a token that is merely set would pass this check and fail at
            # the push — after the archives are built and the release is open,
            # which is the failure this step exists to move earlier. So ask
            # the tap whether this token may actually write to it.
            body=$(curl -s -w '\n%{http_code}' \
              -H "Authorization: Bearer $TAP_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/didik-prabowo/homebrew-tap)
            code=$(printf '%s' "$body" | tail -n1)
            if [ "$code" != "200" ]; then
              echo "::error::HOMEBREW_TAP_TOKEN cannot read didik-prabowo/homebrew-tap (HTTP $code)."
              echo "401 means expired or revoked; 404 means the token cannot see that repository."
              echo "Recreate it with Contents: Read and write on the tap, then set it again."
              exit 1
            fi
            if ! printf '%s' "$body" | grep -q '"push": *true'; then
              echo "::error::HOMEBREW_TAP_TOKEN can read the tap but not write to it."
              echo "It needs Contents: Read and write, not Read-only."
              exit 1
            fi
            echo "token can write to the tap"
          elif printf '%s' "$GITHUB_REF_NAME" | grep -q -- '-'; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set. $GITHUB_REF_NAME is a prerelease, which does not push to the tap, so this is fine for now."
          else
            echo "::error::HOMEBREW_TAP_TOKEN is not set, and $GITHUB_REF_NAME is not a prerelease."
            echo "Create a PAT with write access to didik-prabowo/homebrew-tap,"
            echo "then: gh secret set HOMEBREW_TAP_TOKEN --repo didik-prabowo/uhai"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
