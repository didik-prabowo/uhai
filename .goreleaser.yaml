# What a tag turns into. `git tag v0.1.0 && git push --tags` is the whole
# release process; the workflow in .github/workflows/release.yml runs this.
#
# Try it without tagging anything: `make release-snapshot`.
version: 2

project_name: uhai

before:
  hooks:
    # Not `go mod tidy`: a release must build what is committed, and a hook
    # that edits go.mod during the build can only make the artifact disagree
    # with the tag it is named after.
    - go mod download

builds:
  - id: uhai
    main: ./cmd/uhai
    env:
      # The same reason the Makefile says it: nothing here needs cgo, and
      # without it the binary is static and runs on a machine that has
      # nothing installed.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # No windows. It compiles — `make windows` vets it every CI run — and
    # nobody has ever run it. Shipping a binary is a claim that it works, and
    # docs/roadmap.md says plainly that this one is untested. Someone who
    # wants to try builds from source and tells us what broke; add
    # `windows` here the day one of them reports back.
    flags:
      - -trimpath
    ldflags:
      # -s -w drop the symbol table and DWARF: a third off the binary, and
      # nothing a user of a release would have used them for.
      #
      # .Tag rather than .Version because GoReleaser strips the leading v
      # from the latter, and the binary should answer with the same string
      # that was tagged. internal/build/build_test.go holds this path.
      - -s -w
      - -X github.com/didik-prabowo/uhai/internal/build.version={{ .Tag }}

archives:
  - id: uhai
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    # The commit messages here carry the reasoning and are long. The subject
    # line is what belongs in a changelog; the body is what `git log` is for.
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Co-Authored-By"

release:
  draft: false
  prerelease: auto
  footer: |
    Built without cgo, so the binary is static. macOS will quarantine a
    downloaded one — see the README for the one command that clears it.

# Homebrew. The cask is written and pushed on every tag, so
# `brew install didik-prabowo/tap/uhai` is always the newest release.
#
# A cask and not a formula: `brews:` is deprecated, because Homebrew moved
# pre-built binaries out of formulae. A formula is meant to be something brew
# compiles; this is an archive with a binary in it, which is what a cask is
# for. So there is no `test do` block here — that belongs to formulae — and
# the checks a release needs are the ones CI already ran before publishing.
#
# The token is a Personal Access Token with write access to the tap, saved on
# THIS repository as the secret HOMEBREW_TAP_TOKEN. The built-in GITHUB_TOKEN
# cannot stand in for it: it may only write to the repository it is running
# in, which is the part that surprises people. The release workflow checks
# the secret is set before building anything, because the cask is pushed
# *after* the archives and a missing token would otherwise waste a whole
# release to discover.
homebrew_casks:
  - name: uhai
    repository:
      owner: didik-prabowo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/didik-prabowo/uhai
    description: A coding agent that lives in the terminal
    license: MIT
    # Homebrew quarantines what a cask installs, and these binaries are not
    # notarised — notarising costs an Apple developer account. Without this
    # hook macOS refuses to open what brew just installed, which reads as a
    # broken package rather than as Gatekeeper doing its job. The README says
    # the same thing for a binary downloaded by hand.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/uhai"]
          end
    caveats: |
      uhai opens without a provider. Type /connect to add one; the key is
      kept in ~/.uhai/auth.json, mode 0600.
