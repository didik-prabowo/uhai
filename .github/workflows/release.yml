name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # creating the release and uploading its archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the changelog is built from the commits
          # since the last tag and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # A tag that does not build is a tag that has to be deleted and pushed
      # again, and a deleted tag is the one thing git users cannot be asked to
      # forget. Cheaper to find out here.
      - name: the tests, before anything is published
        run: make check

      # GoReleaser pushes the Homebrew formula after the archives are built,
      # so a missing token is discovered at the end of a release that
      # otherwise worked — and a tag cannot be reused. Ten seconds here saves
      # deleting one.
      # A prerelease does not push to the tap (skip_upload: auto), so it does
      # not need the token — and refusing to release a beta over a secret it
      # will never use would be the check getting in the way of the thing it
      # protects.
      - name: the tap token is set, for a release that will use it
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "token present"
          elif printf '%s' "$GITHUB_REF_NAME" | grep -q -- '-'; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set. $GITHUB_REF_NAME is a prerelease, which does not push to the tap, so this is fine for now."
          else
            echo "::error::HOMEBREW_TAP_TOKEN is not set, and $GITHUB_REF_NAME is not a prerelease."
            echo "Create a PAT with write access to didik-prabowo/homebrew-tap,"
            echo "then: gh secret set HOMEBREW_TAP_TOKEN --repo didik-prabowo/uhai"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
